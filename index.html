<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猴子的百变MOD</title>
    <!-- 网站图标 (Monkey King 风格) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f1520'/><circle cx='50' cy='50' r='36' fill='%23f59e0b' opacity='0.2'/><text y='.78em' font-size='60' x='15'>🐒</text></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
        body { font-family: 'Noto Sans SC', sans-serif; background-color: #080b11; color: #e5e7eb; }
        .glass-panel { background: rgba(15, 21, 32, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.07); }
        .glass-card { background: rgba(18, 26, 40, 0.7); backdrop-filter: blur(8px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .glass-card:hover { border-color: rgba(245, 158, 11, 0.4); box-shadow: 0 8px 25px -5px rgba(245, 158, 11, 0.15); }
        .glow-btn { box-shadow: 0 0 15px rgba(245, 158, 11, 0.3); }
        .glow-btn:hover { box-shadow: 0 0 25px rgba(245, 158, 11, 0.5); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black text-sm">

    <!-- 顶栏导航 -->
    <header class="glass-panel sticky top-0 z-40 border-b border-gray-800/80">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-amber-700 via-amber-500 to-yellow-400 flex items-center justify-center font-black text-black text-base shadow-md overflow-hidden border border-amber-400/40">
                    <span class="text-base">🐒</span>
                </div>
                <div class="flex items-baseline space-x-2">
                    <h1 class="text-base font-bold tracking-wider text-white">小猴子的百变MOD</h1>
                    <span class="text-[11px] text-amber-400/80 hidden sm:inline-block">| 云端实时安全同步版</span>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <button id="uploadTriggerBtn" onclick="openUploadModal()" class="hidden px-3 py-1.5 bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-bold rounded-lg glow-btn text-xs flex items-center space-x-1 transition">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                    <span>上传资源</span>
                </button>
                <button id="adminBtn" onclick="toggleAdminMode()" class="px-3 py-1.5 rounded-lg text-xs font-medium transition bg-gray-800/80 hover:bg-gray-700 text-gray-300 border border-gray-700/60 flex items-center space-x-1.5">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span id="adminBtnText">开启管理员模式</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 py-5 space-y-4">
        
        <!-- 搜索与分类控制台 -->
        <div class="glass-panel rounded-xl p-3.5 space-y-3">
            <div class="flex flex-col md:flex-row gap-3 items-center justify-between">
                <div class="relative w-full md:w-80">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </span>
                    <input type="text" id="searchInput" oninput="filterResources()" placeholder="输入名字/描述快速查找..." class="w-full pl-9 pr-3 py-1.5 bg-gray-900/90 border border-gray-700/80 rounded-lg text-white placeholder-gray-500 focus:outline-none focus:border-amber-500 text-xs">
                </div>

                <div class="flex items-center space-x-1.5 overflow-x-auto w-full md:w-auto no-scrollbar py-0.5" id="categoryTabs">
                    <button onclick="setCategory('all')" class="category-tab px-3 py-1.5 rounded-lg text-xs font-medium transition bg-amber-500 text-black font-bold shrink-0" data-cat="all">全部</button>
                    <button onclick="setCategory('maps')" class="category-tab px-3 py-1.5 rounded-lg text-xs font-medium transition bg-gray-800/80 text-gray-300 hover:bg-gray-700 shrink-0" data-cat="maps">🗺️ 地图地形</button>
                    <button onclick="setCategory('weather')" class="category-tab px-3 py-1.5 rounded-lg text-xs font-medium transition bg-gray-800/80 text-gray-300 hover:bg-gray-700 shrink-0" data-cat="weather">🌤️ 天气效果</button>
                    <button onclick="setCategory('emblems')" class="category-tab px-3 py-1.5 rounded-lg text-xs font-medium transition bg-gray-800/80 text-gray-300 hover:bg-gray-700 shrink-0" data-cat="emblems">🛡️ 专属纹章</button>
                    <button onclick="setCategory('effects')" class="category-tab px-3 py-1.5 rounded-lg text-xs font-medium transition bg-gray-800/80 text-gray-300 hover:bg-gray-700 shrink-0" data-cat="effects">✨ 地图特效</button>
                </div>
            </div>
        </div>

        <!-- 紧凑型展示网格 -->
        <div id="resourceGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3.5">
            <div class="col-span-full py-12 text-center text-gray-400 text-xs">正在从云端同步加载数据...</div>
        </div>
    </main>

    <!-- 底部 -->
    <footer class="border-t border-gray-800/60 mt-10 py-4 text-center text-[11px] text-gray-600">
        <p>小猴子的百变MOD云端分发平台 &copy; 2026 | 多端实时安全同步</p>
    </footer>

    <!-- 上传/添加资源弹窗 -->
    <div id="uploadModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-3">
        <div class="glass-panel rounded-xl max-w-md w-full p-5 space-y-4 border border-gray-700 shadow-2xl relative">
            <div class="flex justify-between items-center pb-2 border-b border-gray-800">
                <h3 class="text-sm font-bold text-white flex items-center space-x-1.5">
                    <span>添加/上传新资源</span>
                </h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-white text-lg font-bold leading-none">&times;</button>
            </div>

            <form id="uploadForm" onsubmit="handleUploadSubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-[11px] font-medium text-gray-400 mb-1">资源名称</label>
                    <input type="text" id="resTitle" required class="w-full px-3 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-amber-500" placeholder="例如：暗夜黑森林高级地形包">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-400 mb-1">资源分类</label>
                    <select id="resCategory" class="w-full px-3 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-amber-500">
                        <option value="maps">🗺️ 地图地形 (Maps)</option>
                        <option value="weather">🌤️ 天气效果 (Weather)</option>
                        <option value="emblems">🛡️ 专属纹章 (Emblems)</option>
                        <option value="effects">✨ 地图特效 (Effects)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-400 mb-1">资源描述/说明</label>
                    <textarea id="resDesc" rows="2" required class="w-full px-3 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-amber-500" placeholder="简短说明安装方法..."></textarea>
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-400 mb-1">封面图片 (本地上传或留空)</label>
                    <input type="file" id="resImage" accept="image/*" class="w-full text-[11px] text-gray-400 file:mr-2 file:py-1 file:px-2.5 file:rounded-lg file:border-0 file:text-[11px] file:font-semibold file:bg-gray-800 file:text-amber-400 hover:file:bg-gray-700 cursor-pointer">
                </div>
                <div>
                    <label class="block text-[11px] font-medium text-gray-400 mb-1">下载直链 / 蓝奏云网盘地址</label>
                    <input type="text" id="resLink" required class="w-full px-3 py-1.5 bg-gray-900 border border-gray-700 rounded-lg text-white focus:outline-none focus:border-amber-500" placeholder="粘贴蓝奏云/网盘链接">
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-1.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg transition">取消</button>
                    <button type="submit" id="saveBtn" class="px-4 py-1.5 bg-amber-500 hover:bg-amber-400 text-black font-bold rounded-lg transition">确认保存并同步云端</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // 🔑 已填入你的云端密钥
        const BIN_ID = '6ad5d3f1ffd5d1605377d5f8';
        const MASTER_KEY = '$2a$10$H6/1k6xZrhDZrng0EcZVyOYg3ZOBe5YmYZnO2iYMiVkJA1qv8UmXi';
        const ADMIN_PWD_HASH = 'f6c18f175402bd0b94a86121f1d1988ef1be4bd0453504ef5756c9a334eefed3'; // 对应密码 1q2w3e4rghzs12..GH

        let isAdmin = false;
        let currentCategory = 'all';
        let resources = [];

        async function sha256(str) {
            const buffer = new TextEncoder().encode(str);
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        function sanitizeInput(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, function(m) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m];
            });
        }

        async function fetchFromCloud() {
            try {
                const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: { 'X-Master-Key': MASTER_KEY }
                });
                const data = await res.json();
                resources = data.record.resources || [];
                renderResources();
            } catch (err) {
                console.error("云端加载失败", err);
                renderResources();
            }
        }

        async function syncToCloud() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify({ resources: resources })
                });
                renderResources();
            } catch (err) {
                alert("云端同步失败，请检查网络或配置。");
            }
        }

        async function toggleAdminMode() {
            if (!isAdmin) {
                const inputPwd = prompt("请输入管理员密码：");
                if (inputPwd) {
                    const hashedInput = await sha256(inputPwd);
                    if (hashedInput === ADMIN_PWD_HASH) {
                        isAdmin = true;
                        updateAdminUI();
                        alert("✅ 管理员身份验证成功！");
                    } else {
                        alert("❌ 管理员密码错误！");
                    }
                }
            } else {
                isAdmin = false;
                updateAdminUI();
                alert("已退出管理员模式。");
            }
        }

        function updateAdminUI() {
            const adminBtn = document.getElementById('adminBtn');
            const adminBtnText = document.getElementById('adminBtnText');
            const uploadBtn = document.getElementById('uploadTriggerBtn');

            if (isAdmin) {
                adminBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition bg-amber-500/20 text-amber-400 border border-amber-500 flex items-center space-x-1.5";
                adminBtnText.innerText = "退出管理员";
                uploadBtn.classList.remove('hidden');
            } else {
                adminBtn.className = "px-3 py-1.5 rounded-lg text-xs font-medium transition bg-gray-800/80 hover:bg-gray-700 text-gray-300 border border-gray-700/60 flex items-center space-x-1.5";
                adminBtnText.innerText = "开启管理员模式";
                uploadBtn.classList.add('hidden');
            }
            renderResources();
        }

        function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
        function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); document.getElementById('uploadForm').reset(); }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.category-tab').forEach(tab => {
                if (tab.dataset.cat === cat) {
                    tab.className = "category-tab px-3 py-1.5 rounded-lg text-xs font-medium transition bg-amber-500 text-black font-bold shrink-0";
                } else {
                    tab.className = "category-tab px-3 py-1.5 rounded-lg text-xs font-medium transition bg-gray-800/80 text-gray-300 hover:bg-gray-700 shrink-0";
                }
            });
            renderResources();
        }

        async function handleUploadSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.innerText = "同步保存中...";
            btn.disabled = true;

            const title = sanitizeInput(document.getElementById('resTitle').value);
            const category = document.getElementById('resCategory').value;
            const desc = sanitizeInput(document.getElementById('resDesc').value);
            const link = sanitizeInput(document.getElementById('resLink').value);
            const imageFile = document.getElementById('resImage').files[0];

            if (imageFile) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    await addNewResource(title, category, desc, e.target.result, link);
                    btn.innerText = "确认保存并同步云端";
                    btn.disabled = false;
                };
                reader.readAsDataURL(imageFile);
            } else {
                const defaultImg = "https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=400&q=80";
                await addNewResource(title, category, desc, defaultImg, link);
                btn.innerText = "确认保存并同步云端";
                btn.disabled = false;
            }
        }

        async function addNewResource(title, category, desc, image, link) {
            const newRes = { id: Date.now(), title, category, desc, image, link };
            resources.unshift(newRes);
            await syncToCloud();
            closeUploadModal();
            alert("🎉 资源添加成功并自动同步！");
        }

        async function deleteResource(id) {
            if (confirm("确定要删除这个资源吗？")) {
                resources = resources.filter(item => item.id !== id);
                await syncToCloud();
            }
        }

        function filterResources() { renderResources(); }

        function renderResources() {
            const grid = document.getElementById('resourceGrid');
            const searchKeyword = sanitizeInput(document.getElementById('searchInput').value.toLowerCase());
            
            const filtered = resources.filter(item => {
                const matchesCat = currentCategory === 'all' || item.category === currentCategory;
                const matchesSearch = item.title.toLowerCase().includes(searchKeyword) || item.desc.toLowerCase().includes(searchKeyword);
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-gray-500 text-xs">暂无相关资源或未找到结果</div>`;
                return;
            }

            grid.innerHTML = filtered.map(item => {
                let catLabel = item.category === 'maps' ? '地图' : item.category === 'weather' ? '天气' : item.category === 'emblems' ? '纹章' : '特效';

                return `
                    <div class="glass-card rounded-xl overflow-hidden flex flex-col justify-between transition duration-200 group relative">
                        <div>
                            <div class="relative h-28 overflow-hidden bg-gray-900">
                                <img src="${item.image}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <span class="absolute top-1.5 left-1.5 px-2 py-0.5 bg-black/70 backdrop-blur-md rounded text-[10px] font-semibold text-amber-400 border border-white/10">${catLabel}</span>
                                ${isAdmin ? `
                                    <button onclick="deleteResource(${item.id})" class="absolute top-1.5 right-1.5 p-1 bg-red-600/80 hover:bg-red-600 text-white rounded transition shadow" title="删除资源">
                                        <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                ` : ''}
                            </div>
                            <div class="p-2.5 space-y-1">
                                <h3 class="text-xs font-bold text-white line-clamp-1 group-hover:text-amber-400 transition" title="${item.title}">${item.title}</h3>
                                <p class="text-[11px] text-gray-400 line-clamp-2 leading-tight">${item.desc}</p>
                            </div>
                        </div>
                        <div class="p-2.5 pt-0">
                            <a href="${item.link}" target="_blank" class="w-full py-1.5 bg-gray-800/90 hover:bg-amber-500 hover:text-black text-gray-200 text-xs font-bold rounded-lg transition text-center flex items-center justify-center space-x-1 border border-gray-700/50">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                                <span>下载资源</span>
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        fetchFromCloud();
    </script>
</body>
</html>
