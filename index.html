<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小猴子的百变MOD</title>
    <!-- 网站图标 (Monkey King 风格) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230f1520'/><circle cx='50' cy='50' r='36' fill='%23f59e0b' opacity='0.2'/><text y='.78em' font-size='60' x='15'>🐒</text></svg>">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入高科技风格样式表 -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-amber-500 selection:text-black text-sm">

    <!-- 顶部科技感导航栏 -->
    <header class="tech-header sticky top-0 z-40 w-full">
        <div class="max-w-7xl mx-auto px-3 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2.5">
                <div class="relative">
                    <div class="absolute -inset-1 bg-gradient-to-r from-amber-500 to-cyan-500 rounded-xl blur opacity-70"></div>
                    <div class="relative w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gray-900 flex items-center justify-center font-black text-amber-400 text-base sm:text-lg border border-amber-500/50 shadow-inner">
                        🐒
                    </div>
                </div>
                <div class="flex flex-col">
                    <h1 class="text-xs sm:text-base font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-white via-amber-200 to-amber-400">小猴子的百变MOD</h1>
                    <span class="text-[9px] sm:text-[10px] tracking-widest text-cyan-400 font-mono uppercase">◆ CLOUD SECURE SYNC ◆</span>
                </div>
            </div>
            
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- 独立的高亮教程按钮 -->
                <button onclick="openGuideModal()" class="px-3 py-1.5 sm:py-2 bg-gradient-to-r from-cyan-500 via-teal-500 to-blue-500 text-black font-black rounded-xl pulse-glow text-xs flex items-center space-x-1.5 transition transform hover:scale-105">
                    <svg class="w-4 h-4 text-black" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    <span>📖 教你安装MOD</span>
                </button>

                <!-- 上传按钮（仅管理员显示） -->
                <button id="uploadTriggerBtn" onclick="openUploadModal()" class="hidden px-3 py-1.5 sm:py-2 bg-gradient-to-r from-amber-500 to-yellow-500 text-black font-black rounded-xl glow-btn text-xs flex items-center space-x-1 transition transform hover:scale-105">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                    <span>上传资源</span>
                </button>

                <!-- 管理员模式开关 -->
                <button id="adminBtn" onclick="toggleAdminMode()" class="px-3 py-1.5 sm:py-2 rounded-xl text-xs font-semibold transition bg-gray-900/90 hover:bg-gray-800 text-gray-300 border border-gray-700/80 flex items-center space-x-1.5 shadow-lg">
                    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span id="adminBtnText">管理员模式</span>
                </button>
            </div>
        </div>
    </header>

    <!-- 主体内容 -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-3 sm:px-6 py-5 sm:py-6 space-y-4 sm:space-y-5">
        
        <!-- 管理员开启状态中央提示框 -->
        <div id="adminNoticeBar" class="hidden w-full text-center py-2 px-4 rounded-xl glass-panel border border-amber-500/40 shadow-lg shadow-amber-500/10 transition">
            <p class="text-xs font-bold text-amber-400 tracking-wider flex items-center justify-center space-x-2">
                <span class="animate-pulse">⚡</span>
                <span>当前处于【管理员模式】—— 可上传/删除资源，并在教程弹窗中直接编辑文章</span>
                <span class="animate-pulse">⚡</span>
            </p>
        </div>

        <!-- 搜索与高科技分类控制台（自适应折行布局） -->
        <div class="glass-panel rounded-2xl p-3.5 sm:p-4 space-y-3 shadow-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-48 sm:w-64 h-48 sm:h-64 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-0 left-0 w-48 sm:w-64 h-48 sm:h-64 bg-cyan-500/10 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="flex flex-col gap-3 relative z-10">
                <!-- 搜索框 -->
                <div class="relative w-full">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                        <svg class="w-4 h-4 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                    </span>
                    <input type="text" id="searchInput" oninput="filterResources()" placeholder="输入MOD名称检索..." class="w-full pl-10 pr-4 py-2 bg-gray-950/80 border border-cyan-500/30 rounded-xl text-white placeholder-gray-500 focus:outline-none focus:border-cyan-400 focus:ring-1 focus:ring-cyan-400 text-xs transition shadow-inner">
                </div>

                <!-- 分类标签页 -->
                <div class="flex flex-wrap items-center gap-1.5 sm:gap-2 pt-1" id="categoryTabs">
                    <button onclick="setCategory('all')" class="category-tab px-3 py-1.5 rounded-xl text-xs font-bold transition bg-amber-500 text-black shadow-lg shadow-amber-500/20 shrink-0" data-cat="all">全部</button>
                    <button onclick="setCategory('maps')" class="category-tab px-3 py-1.5 rounded-xl text-xs font-medium transition bg-gray-900/80 text-gray-300 hover:bg-gray-800 border border-gray-800 shrink-0" data-cat="maps">🗺️ 地图地形</button>
                    <button onclick="setCategory('weather')" class="category-tab px-3 py-1.5 rounded-xl text-xs font-medium transition bg-gray-900/80 text-gray-300 hover:bg-gray-800 border border-gray-800 shrink-0" data-cat="weather">🌤️ 天气效果</button>
                    <button onclick="setCategory('emblems')" class="category-tab px-3 py-1.5 rounded-xl text-xs font-medium transition bg-gray-900/80 text-gray-300 hover:bg-gray-800 border border-gray-800 shrink-0" data-cat="emblems">🛡️ 专属纹章</button>
                    <button onclick="setCategory('effects')" class="category-tab px-3 py-1.5 rounded-xl text-xs font-medium transition bg-gray-900/80 text-gray-300 hover:bg-gray-800 border border-gray-800 shrink-0" data-cat="effects">✨ 地图特效</button>
                    <button onclick="setCategory('wards')" class="category-tab px-3 py-1.5 rounded-xl text-xs font-medium transition bg-gray-900/80 text-gray-300 hover:bg-gray-800 border border-gray-800 shrink-0" data-cat="wards">👁️ 守卫眼位</button>
                    <button onclick="setCategory('couriers')" class="category-tab px-3 py-1.5 rounded-xl text-xs font-medium transition bg-gray-900/80 text-gray-300 hover:bg-gray-800 border border-gray-800 shrink-0" data-cat="couriers">🐴 战术信使</button>
                    <button onclick="setCategory('arcana')" class="category-tab px-3 py-1.5 rounded-xl text-xs font-medium transition bg-gray-900/80 text-gray-300 hover:bg-gray-800 border border-gray-800 shrink-0" data-cat="arcana">👑 英雄至宝</button>
                    <button onclick="setCategory('personas')" class="category-tab px-3 py-1.5 rounded-xl text-xs font-medium transition bg-gray-900/80 text-gray-300 hover:bg-gray-800 border border-gray-800 shrink-0" data-cat="personas">🎭 英雄身心</button>
                </div>
            </div>
        </div>

        <!-- 动态资源网格展示区 -->
        <div id="resourceGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-3.5">
            <!-- 动态渲染 -->
        </div>
    </main>

    <!-- 底部 -->
    <footer class="tech-footer border-t border-gray-800/80 mt-12 py-5 text-center text-xs text-gray-500 w-full">
        <p class="tracking-wider">小猴子的百变MOD云端分发终端 &copy; 2026 | Cloudflare Edge Secured</p>
    </footer>

    <!-- 教程文章阅读弹窗 -->
    <div id="guideModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3">
        <div class="glass-panel rounded-2xl max-w-2xl w-full max-h-[85vh] p-5 sm:p-6 space-y-4 border border-cyan-500/40 shadow-2xl relative flex flex-col">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-cyan-500 via-amber-500 to-cyan-500"></div>
            
            <div class="flex justify-between items-center pb-2 border-b border-gray-800 shrink-0">
                <h3 class="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-cyan-400 flex items-center space-x-2">
                    <span>📖 MOD 安装使用教程</span>
                </h3>
                <button onclick="closeGuideModal()" class="text-gray-400 hover:text-white text-xl font-bold leading-none">&times;</button>
            </div>

            <!-- 文章内容展示区 -->
            <div id="guideContentDisplay" class="overflow-y-auto space-y-3 text-xs text-gray-300 pr-2 leading-relaxed flex-grow">
                <!-- 动态填充 -->
            </div>

            <div class="flex justify-between items-center pt-2 border-t border-gray-800 shrink-0">
                <!-- 管理员专属编辑按钮 -->
                <button id="adminEditGuideBtn" onclick="openEditGuideModal()" class="hidden px-4 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-400 rounded-xl transition border border-amber-500/50 text-xs font-bold flex items-center space-x-1">
                    <span>✏️ 编辑本文档</span>
                </button>
                <button onclick="closeGuideModal()" class="px-5 py-1.5 bg-gray-900 hover:bg-gray-800 text-cyan-300 rounded-xl transition border border-cyan-500/30 text-xs font-bold ml-auto">关闭</button>
            </div>
        </div>
    </div>

    <!-- 编辑教学文章弹窗 (仅管理员可用) -->
    <div id="editGuideModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3">
        <div class="glass-panel rounded-2xl max-w-xl w-full p-5 sm:p-6 space-y-4 border border-amber-500/40 shadow-2xl relative">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-500 to-yellow-500"></div>
            
            <div class="flex justify-between items-center pb-2 border-b border-gray-800">
                <h3 class="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-amber-400 flex items-center space-x-2">
                    <span>✏️ 编辑安装教程文章</span>
                </h3>
                <button onclick="closeEditGuideModal()" class="text-gray-400 hover:text-white text-xl font-bold leading-none">&times;</button>
            </div>

            <form id="editGuideForm" onsubmit="handleEditGuideSubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-[11px] font-semibold text-amber-400 mb-1 uppercase tracking-wider">教程文章正文内容 (支持 HTML 标签排版)</label>
                    <textarea id="guideTextarea" rows="10" required class="w-full p-3 bg-gray-950 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-amber-400 transition font-mono text-[11px]" placeholder="在此编写教程内容..."></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeEditGuideModal()" class="px-4 py-1.5 bg-gray-900 hover:bg-gray-800 text-gray-300 rounded-xl transition">取消</button>
                    <button type="submit" id="saveGuideBtn" class="px-4 py-1.5 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-black font-black rounded-xl transition shadow-lg shadow-amber-500/20">保存并同步云端</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 上传/添加资源弹窗 -->
    <div id="uploadModal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-md hidden flex items-center justify-center p-3">
        <div class="glass-panel rounded-2xl max-w-md w-full p-5 sm:p-6 space-y-4 border border-cyan-500/30 shadow-2xl relative">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-amber-500 via-cyan-500 to-amber-500"></div>
            
            <div class="flex justify-between items-center pb-2 border-b border-gray-800">
                <h3 class="text-sm font-black text-transparent bg-clip-text bg-gradient-to-r from-white to-amber-400 flex items-center space-x-2">
                    <span>⚡ 上传/添加全新 MOD 资源</span>
                </h3>
                <button onclick="closeUploadModal()" class="text-gray-400 hover:text-white text-xl font-bold leading-none">&times;</button>
            </div>

            <form id="uploadForm" onsubmit="handleUploadSubmit(event)" class="space-y-3 text-xs">
                <div>
                    <label class="block text-[11px] font-semibold text-cyan-400 mb-1 uppercase tracking-wider">资源名称</label>
                    <input type="text" id="resTitle" required class="w-full px-3 py-1.5 bg-gray-950 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-400 transition" placeholder="例如：暗夜黑森林高级地形包">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-cyan-400 mb-1 uppercase tracking-wider">资源分类</label>
                    <select id="resCategory" class="w-full px-3 py-1.5 bg-gray-950 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-400 transition">
                        <option value="maps">🗺️ 地图地形 (Maps)</option>
                        <option value="weather">🌤️ 天气效果 (Weather)</option>
                        <option value="emblems">🛡️ 专属纹章 (Emblems)</option>
                        <option value="effects">✨ 地图特效 (Effects)</option>
                        <option value="wards">👁️ 守卫眼位 (Wards)</option>
                        <option value="couriers">🐴 战术信使 (Couriers)</option>
                        <option value="arcana">👑 英雄至宝 (Arcana)</option>
                        <option value="personas">🎭 英雄身心 (Personas)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-cyan-400 mb-1 uppercase tracking-wider">资源描述/说明</label>
                    <textarea id="resDesc" rows="2" required class="w-full px-3 py-1.5 bg-gray-950 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-400 transition" placeholder="简短说明安装方法..."></textarea>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-cyan-400 mb-1 uppercase tracking-wider">封面图片 (本地上传或留空)</label>
                    <input type="file" id="resImage" accept="image/*" class="w-full text-xs text-gray-400 file:mr-3 file:py-1 file:px-2.5 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-gray-800 file:text-amber-400 hover:file:bg-gray-700 cursor-pointer">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-cyan-400 mb-1 uppercase tracking-wider">下载直链 / 蓝奏云网盘地址</label>
                    <input type="text" id="resLink" required class="w-full px-3 py-1.5 bg-gray-950 border border-gray-800 rounded-xl text-white focus:outline-none focus:border-cyan-400 transition" placeholder="粘贴蓝奏云/网盘链接">
                </div>

                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeUploadModal()" class="px-4 py-1.5 bg-gray-900 hover:bg-gray-800 text-gray-300 rounded-xl transition">取消</button>
                    <button type="submit" id="saveBtn" class="px-4 py-1.5 bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-400 hover:to-yellow-400 text-black font-black rounded-xl transition shadow-lg shadow-amber-500/20">确认保存并同步云端</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 脚本 -->
    <script src="script.js"></script>
</body>
</html>
